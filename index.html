<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>さんぽナビ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --green:#1a7a4a;--green-light:#e8f5ed;
  --blue:#2563a8;--blue-light:#e8f0fc;
  --orange:#d4620a;--orange-light:#fff3e8;
  --gray-1:#f7f6f4;--gray-2:#eeece8;--gray-3:#d8d5ce;
  --text:#1a1a18;--text-sub:#5c5a54;--text-muted:#9b9890;
  --radius:14px;--radius-sm:10px;--shadow:0 2px 12px rgba(0,0,0,.08);
}
html,body{height:100%;background:#fff;font-family:-apple-system,'Hiragino Sans','Yu Gothic UI',sans-serif;color:var(--text);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;overflow:hidden}
.screen{display:none;flex:1;flex-direction:column;overflow:hidden;animation:fadeIn .2s ease}
.screen.active{display:flex}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
/* status */
.status-bar{height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;border-bottom:1px solid var(--gray-2)}
.app-name{font-size:16px;font-weight:800;color:var(--green);letter-spacing:-.01em}
/* step */
.step-bar{display:flex;align-items:center;padding:8px 12px;gap:4px;background:#fff;flex-shrink:0;border-bottom:1px solid var(--gray-2)}
.step-item{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--text-muted);flex:1;min-width:0}
.step-item.done{color:var(--green)}.step-item.active{color:var(--text);font-weight:800}
.step-num{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;background:var(--gray-2);color:var(--text-muted);flex-shrink:0}
.step-item.done .step-num{background:var(--green);color:#fff}.step-item.active .step-num{background:var(--text);color:#fff}
.step-div{width:10px;height:1px;background:var(--gray-3);flex-shrink:0}
/* layout */
.content{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
.content::-webkit-scrollbar{display:none}
.bottom-bar{padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--gray-2);flex-shrink:0}
/* buttons */
.btn-main{width:100%;padding:14px;border-radius:var(--radius);border:none;font-size:15px;font-weight:800;cursor:pointer;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;transition:transform .1s,opacity .1s}
.btn-main:active{transform:scale(.97);opacity:.9}.btn-main:disabled{background:var(--gray-3);color:var(--text-muted);cursor:default;transform:none;opacity:1}
.btn-sub{width:100%;padding:11px;border-radius:var(--radius);border:1.5px solid var(--gray-3);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-sub);margin-top:7px}
.btn-sub:active{background:var(--gray-1)}
/* labels */
.lbl{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.07em;text-transform:uppercase;margin:14px 0 8px}
.lbl:first-child{margin-top:0}
/* S1 distance */
.dist-hero{text-align:center;padding:12px 0 8px}
.dist-hero .num{font-size:60px;font-weight:900;color:var(--text);line-height:1;letter-spacing:-.04em}
.dist-hero .unit{font-size:18px;color:var(--text-sub);font-weight:600;margin-top:2px}
.dist-hero .wt{font-size:12px;color:var(--text-muted);margin-top:4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,var(--green) var(--pct,28%),var(--gray-2) var(--pct,28%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--green);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pbtn{padding:9px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-3);background:#fff;font-size:13px;font-weight:700;cursor:pointer;color:var(--text-sub);display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .15s}
.pbtn small{font-size:10px;font-weight:500;color:var(--text-muted)}
.pbtn.active,.pbtn.active small{color:var(--green)}.pbtn.active{background:var(--green-light);border-color:var(--green)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mopt{padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-3);background:#fff;font-size:12px;font-weight:700;cursor:pointer;color:var(--text-sub);display:flex;align-items:center;gap:7px;transition:all .15s}
.mopt .mi{font-size:20px}.mopt.active{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.atags{display:flex;flex-wrap:wrap;gap:6px}
.atag{padding:7px 12px;border-radius:20px;border:1.5px solid var(--gray-3);font-size:12px;font-weight:700;cursor:pointer;color:var(--text-sub);background:#fff;transition:all .15s}
.atag.active{background:var(--orange-light);border-color:var(--orange);color:var(--orange)}
/* loading */
.loading-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:12px}
.spinner{width:34px;height:34px;border:3px solid var(--gray-2);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-size:13px;color:var(--text-muted);font-weight:600}
/* station cards */
.stcard{display:flex;align-items:center;gap:11px;padding:12px 13px;border-radius:var(--radius);border:1.5px solid var(--gray-2);background:#fff;margin-bottom:8px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.stcard:active{transform:scale(.98)}.stcard.selected{border-color:var(--green);background:var(--green-light)}
.sticon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:var(--gray-1)}
.stin{flex:1;min-width:0}.stname{font-size:15px;font-weight:800;color:var(--text)}
.stmeta{font-size:11px;color:var(--text-muted);margin-top:2px}
.sthigh{font-size:11px;color:var(--text-sub);margin-top:3px}
.stbadge{font-size:10px;padding:2px 8px;border-radius:5px;font-weight:700;margin-left:auto;flex-shrink:0;white-space:nowrap}
.bg{background:var(--green-light);color:var(--green)}.bb{background:var(--blue-light);color:var(--blue)}.bo{background:var(--orange-light);color:var(--orange)}
/* spot cards */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.spcard{padding:11px;border-radius:var(--radius-sm);border:1.5px solid var(--gray-2);background:#fff;cursor:pointer;position:relative;transition:all .15s}
.spcard:active{transform:scale(.97)}.spcard.selected{border-color:var(--blue);background:var(--blue-light)}
.spchk{position:absolute;top:7px;right:7px;width:17px;height:17px;border-radius:50%;background:var(--blue);display:none;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800}
.spcard.selected .spchk{display:flex}
.spem{font-size:22px;margin-bottom:5px}.spname{font-size:12px;font-weight:800;color:var(--text);line-height:1.3}
.spdet{font-size:10px;color:var(--text-muted);margin-top:2px}
.sptag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:4px;margin-top:4px;font-weight:700}
.tcafe{background:#fff3e8;color:#b85c00}.tfood{background:#fdecea;color:#c0392b}.tshop{background:#e8f5ed;color:#1a7a4a}.tpark{background:#e8f4e8;color:#2e7d32}.tother{background:#f0f0f0;color:#555}
.scnt{font-size:12px;color:var(--blue);font-weight:700;text-align:center;margin-bottom:8px;min-height:17px}
/* route */
#map{width:100%;height:200px;border-radius:var(--radius);overflow:hidden;border:1.5px solid var(--gray-2);margin-bottom:12px}
.rchips{display:flex;flex-wrap:nowrap;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.rchips::-webkit-scrollbar{display:none}
.rchip{display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:700;border:1.5px solid;white-space:nowrap;flex-shrink:0}
.cg{background:#e8f5ed;border-color:#a5d6a7;color:#2e7d32}
.cw{background:#fff8e1;border-color:#ffe082;color:#e65100}
.cb{background:#fdecea;border-color:#ef9a9a;color:#c62828}
.sgrid4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.scard{background:var(--gray-1);border-radius:var(--radius-sm);padding:12px 10px;display:flex;align-items:center;gap:10px}
.scard-icon{font-size:20px;flex-shrink:0}
.scard-body{}
.sval{font-size:20px;font-weight:900;color:var(--text);line-height:1}
.ssub{font-size:11px;color:var(--text-muted);margin-top:2px;font-weight:600}
.wps{background:#fff;border:1.5px solid var(--gray-2);border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.wp{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-bottom:1px solid var(--gray-2)}.wp:last-child{border-bottom:none}
.wpdw{display:flex;flex-direction:column;align-items:center;flex-shrink:0;padding-top:3px}
.wpd{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.wpl{width:2px;flex:1;min-height:20px;background:var(--gray-3);margin:3px 0}
.wpn{font-size:13px;font-weight:700;color:var(--text)}
.wpm{font-size:11px;color:var(--text-muted);margin-top:2px}
.abox{display:flex;gap:8px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-sm);border:1.5px solid;margin-bottom:8px;font-size:13px;font-weight:600;line-height:1.6}
.ag{background:var(--green-light);border-color:#a5d6a7;color:#1b5e20}
.ao{background:var(--orange-light);border-color:#ffcc80;color:#bf360c}
.errbox{background:#fdecea;border:1.5px solid #ef9a9a;border-radius:var(--radius-sm);padding:12px;font-size:13px;color:#c62828;margin-bottom:10px;line-height:1.6}
.backbtn{font-size:13px;color:var(--blue);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:3px;margin-bottom:10px;border:none;background:none;padding:0}
#rtbody{display:block;width:100%}
.rt-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rt-stat{background:var(--gray-1);border-radius:var(--radius-sm);padding:12px 14px;display:flex;align-items:center;gap:10px}
.rt-stat-icon{font-size:22px;flex-shrink:0}
.rt-stat-val{font-size:22px;font-weight:900;color:var(--text);line-height:1}
.rt-stat-lbl{font-size:11px;color:var(--text-muted);margin-top:3px;font-weight:600}
.rttl{font-size:16px;font-weight:900;color:var(--text);margin-bottom:10px}
.info-box{font-size:11px;color:var(--text-muted);line-height:1.6;padding:9px 11px;background:var(--gray-1);border-radius:var(--radius-sm);margin-top:6px}
</style>
</head>
<body>
<div id="app">

<div class="status-bar">
  <span id="sttime" style="font-size:13px;font-weight:700">9:41</span>
  <div class="app-name">🌿 さんぽナビ</div>
  <span style="font-size:13px">●●●</span>
</div>
<div class="step-bar">
  <div class="step-item active" id="step1"><div class="step-num">1</div><span>距離</span></div>
  <div class="step-div"></div>
  <div class="step-item" id="step2"><div class="step-num">2</div><span>駅</span></div>
  <div class="step-div"></div>
  <div class="step-item" id="step3"><div class="step-num">3</div><span>スポット</span></div>
  <div class="step-div"></div>
  <div class="step-item" id="step4"><div class="step-num">4</div><span>ルート</span></div>
</div>

<!-- S1: 距離設定 -->
<div class="screen active" id="screen1">
  <div class="content">
    <div class="lbl">散歩の距離</div>
    <div class="dist-hero">
      <div class="num" id="dnum">3.0</div>
      <div class="unit">km</div>
      <div class="wt" id="wtime">ゆっくり歩いて 約40分</div>
    </div>
    <input type="range" id="drange" min="1" max="10" step="0.5" value="3" oninput="onDC(this.value)">
    <div style="display:flex;justify-content:space-between;margin-top:4px;font-size:11px;color:var(--text-muted)"><span>1km</span><span>10km</span></div>
    <div class="lbl" style="margin-top:14px">プリセット</div>
    <div class="pgrid">
      <button class="pbtn" onclick="setD(1.5,this)">1.5km<small>お散歩</small></button>
      <button class="pbtn active" onclick="setD(3,this)">3km<small>普通</small></button>
      <button class="pbtn" onclick="setD(5,this)">5km<small>しっかり</small></button>
      <button class="pbtn" onclick="setD(8,this)">8km<small>ガッツリ</small></button>
    </div>
    <div class="lbl">目的</div>
    <div class="mgrid">
      <div class="mopt active" id="mrelax" onclick="selMode('relax')"><span class="mi">🌸</span><div><div>のんびり</div><div style="font-size:10px;color:var(--text-muted);margin-top:1px">公園・カフェ重視</div></div></div>
      <div class="mopt" id="mactive" onclick="selMode('active')"><span class="mi">🏃</span><div><div>アクティブ</div><div style="font-size:10px;color:var(--text-muted);margin-top:1px">距離・景色重視</div></div></div>
    </div>
    <div class="lbl">避けたいこと</div>
    <div class="atags">
      <div class="atag" onclick="togAv(this,'slope')">⛰️ 坂を避ける</div>
      <div class="atag" onclick="togAv(this,'sun')">☀️ 日差しを避ける</div>
      <div class="atag" onclick="togAv(this,'crowd')">👥 人混みを避ける</div>
      <div class="atag" onclick="togAv(this,'road')">🚗 幹線道路を避ける</div>
    </div>
    <div style="height:14px"></div>
  </div>
  <div class="bottom-bar">
    <button class="btn-main" onclick="goSt()">🚉 周辺の駅を探す</button>
  </div>
</div>

<!-- S2: 駅選択 -->
<div class="screen" id="screen2">
  <div class="content">
    <button class="backbtn" onclick="goTo(1)">← 戻る</button>
    <div id="stload" class="loading-box"><div class="spinner"></div><div class="ltxt" id="lmsg">現在地を取得中…</div></div>
    <div id="stlist" style="display:none">
      <div class="lbl" id="sthdr">近くの駅を選ぶ</div>
      <div id="stcards"></div>
      <div class="info-box" id="stinfo"></div>
    </div>
    <div id="sterr" class="errbox" style="display:none"></div>
    <div style="height:14px"></div>
  </div>
  <div class="bottom-bar">
    <button class="btn-main" id="btnsp" onclick="goSp()" disabled>📍 スポットを選ぶ</button>
  </div>
</div>

<!-- S3: スポット選択 -->
<div class="screen" id="screen3">
  <div class="content">
    <button class="backbtn" onclick="goTo(2)">← 戻る</button>
    <div id="spload" class="loading-box"><div class="spinner"></div><div class="ltxt" id="splmsg">周辺スポットを検索中…</div></div>
    <div id="splist" style="display:none">
      <div class="scnt" id="scnt">スポットを選んでください（複数選択可）</div>
      <div id="spcards"></div>
    </div>
    <div id="sperr" class="errbox" style="display:none"></div>
    <div style="height:14px"></div>
  </div>
  <div class="bottom-bar">
    <button class="btn-main" id="btnrt" onclick="goRt()" disabled>🗺️ ルートを作成する</button>
  </div>
</div>

<!-- S4: ルート表示 -->
<div class="screen" id="screen4">
  <div class="content">
    <button class="backbtn" onclick="goTo(3)">← 戻る</button>
    <div id="rtload" class="loading-box"><div class="spinner"></div><div class="ltxt" id="rtlmsg">ルートを計算中…</div></div>
    <div id="rtbody" style="display:none">
      <div class="rttl" id="rttl"></div>
      <div id="map"></div>
      <div class="rchips" id="rchips"></div>
      <div class="rt-stats" id="sgrid4"></div>
      <div class="lbl" style="margin-top:14px">経由地</div>
      <div class="wps" id="wps"></div>
      <div id="rtips"></div>
      <div style="height:14px"></div>
    </div>
    <div id="rterr" class="errbox" style="display:none"></div>
  </div>
  <div class="bottom-bar" id="rtbot" style="display:none">
    <button class="btn-main" onclick="startNav()">🧭 Googleマップでナビ開始</button>
    <button class="btn-sub" onclick="regenRt()">🔄 別のルートを提案</button>
  </div>
</div>

</div>

<!-- Google Maps JS API（キー置き換え箇所） -->
<script>
// ============================================================
// ★ ここにあなたのGoogle Maps APIキーを入れてください ★
const GMAPS_KEY = 'AIzaSyDzkmAOeCGFBWCISNvr_4FkaUyhzlJRX0A';
// ============================================================

// Google Maps APIを動的ロード
(function(){
  const s=document.createElement('script');
  s.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&libraries=places&language=ja&callback=onMapsReady`;
  s.async=true; s.defer=true;
  document.head.appendChild(s);
})();

// ============================================================
// STATE
// ============================================================
const S={
  dist:3, mode:'relax', avoids:[],
  lat:null, lng:null,
  station:null, stations:[],
  spots:[], selSpots:[],
  route:null,
  gmap:null, directionsRenderer:null,
  mapsReady:false, mapsReadyCbs:[]
};

function onMapsReady(){
  S.mapsReady=true;
  S.mapsReadyCbs.forEach(cb=>cb());
  S.mapsReadyCbs=[];
}
function whenMapsReady(cb){
  if(S.mapsReady) cb(); else S.mapsReadyCbs.push(cb);
}

// ============================================================
// TIME
// ============================================================
function updTime(){const n=new Date();document.getElementById('sttime').textContent=n.getHours()+':'+(n.getMinutes()+'').padStart(2,'0');}
updTime(); setInterval(updTime,30000);

// ============================================================
// STEP / SCREEN
// ============================================================
function setStep(n){for(let i=1;i<=4;i++){const e=document.getElementById('step'+i);e.classList.remove('active','done');if(i<n)e.classList.add('done');else if(i===n)e.classList.add('active');}}
function goTo(n){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen'+n).classList.add('active');setStep(n);}

// ============================================================
// S1: 距離設定
// ============================================================
function onDC(v){
  v=parseFloat(v); S.dist=v;
  document.getElementById('dnum').textContent=v.toFixed(1);
  document.getElementById('wtime').textContent='ゆっくり歩いて 約'+Math.round(v/4.5*60)+'分';
  document.getElementById('drange').style.setProperty('--pct',((v-1)/9*100).toFixed(1)+'%');
  document.querySelectorAll('.pbtn').forEach(b=>b.classList.remove('active'));
}
function setD(v,b){S.dist=v;document.getElementById('drange').value=v;onDC(v);document.querySelectorAll('.pbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');}
function selMode(m){S.mode=m;document.getElementById('mrelax').classList.toggle('active',m==='relax');document.getElementById('mactive').classList.toggle('active',m==='active');}
function togAv(el,k){el.classList.toggle('active');const i=S.avoids.indexOf(k);if(i>=0)S.avoids.splice(i,1);else S.avoids.push(k);}
onDC(3);

// ============================================================
// GEOLOCATION
// ============================================================
function getLoc(){
  return new Promise(res=>{
    if(!navigator.geolocation){res({lat:35.6566,lng:139.7459});return;}
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>res({lat:35.6566,lng:139.7459}),
      {timeout:8000,enableHighAccuracy:true}
    );
  });
}

// ============================================================
// S2: 駅取得 — Places API Nearby Search (transit_station)
// ============================================================
async function goSt(){
  goTo(2);
  show('stload'); hide('stlist'); hide('sterr');
  document.getElementById('btnsp').disabled=true;
  setMsg('lmsg','現在地を取得中…');
  try{
    const pos=await getLoc();
    S.lat=pos.lat; S.lng=pos.lng;
    setMsg('lmsg','駅を検索中…');
    await whenMapsReadyAsync();
    const stations=await fetchNearbyStations(pos.lat,pos.lng);
    if(!stations.length) throw new Error('近くに駅が見つかりませんでした');
    const enriched=aiEnrichStations(stations, pos.lat, pos.lng);
    S.stations=enriched;
    renderSt(enriched);
    hide('stload'); show('stlist');
  }catch(e){
    hide('stload'); show('sterr');
    document.getElementById('sterr').textContent='エラー: '+e.message+'\n\nAPIキーの設定・有効化を確認してください。';
  }
}

function fetchNearbyStations(lat,lng){
  return new Promise((res,rej)=>{
    // 散歩距離の約40〜50%を片道距離として検索半径に設定（実際の道のりは直線の1.3倍程度）
    // 例: 3km設定 → 片道1.5km → 直線換算で約1150m → 少し余裕を持って1400m
    const onewayKm = S.dist * 0.5;
    const radius = Math.round(onewayKm * 1000 * 0.9); // 直線距離で90%を半径に
    const clampedRadius = Math.max(500, Math.min(radius, 4000));

    const svc=new google.maps.places.PlacesService(document.createElement('div'));
    svc.nearbySearch({
      location:{lat,lng},
      radius: clampedRadius,
      type:'transit_station',
      language:'ja'
    },(results,status)=>{
      if(status!==google.maps.places.PlacesServiceStatus.OK&&status!==google.maps.places.PlacesServiceStatus.ZERO_RESULTS){
        rej(new Error('Places API: '+status)); return;
      }
      const stations=(results||[]).slice(0,6).map(p=>{
        // 直線距離から徒歩時間を概算（道のり係数1.3、速度4.5km/h）
        const dlat=p.geometry.location.lat(), dlng=p.geometry.location.lng();
        const straightKm=Math.sqrt(Math.pow((dlat-lat)*111,2)+Math.pow((dlng-lng)*91,2));
        const walkKm=straightKm*1.3; // 道のり係数
        return {
          place_id: p.place_id,
          name: p.name,
          lat: dlat, lng: dlng,
          rating: p.rating||null,
          vicinity: p.vicinity||'',
          distKm: walkKm.toFixed(1),
          durationMin: Math.round(walkKm/4.5*60)
        };
      });
      // 設定距離の半分に近い順にソート（近すぎず遠すぎない駅を優先）
      const targetKm = S.dist * 0.45;
      stations.sort((a,b)=>Math.abs(parseFloat(a.distKm)-targetKm)-Math.abs(parseFloat(b.distKm)-targetKm));
      res(stations);
    });
  });
}

// Claude AIで駅の特徴・バッジを付与（Directions APIは使わず直線距離で処理）
function aiEnrichStations(stations, lat, lng){
  // Claude APIなし — 距離・設定条件だけでバッジとコメントを付与
  const targetKm = S.dist * 0.45;
  return stations.map((st, i) => {
    const dist = parseFloat(st.distKm);
    const diff = Math.abs(dist - targetKm);
    // バッジ判定
    let badge = null, badgeType = 'bg', highlight = '';
    if(i === 0) { badge = 'おすすめ'; badgeType = 'bg'; }
    else if(dist < targetKm * 0.6) { badge = '近い'; badgeType = 'bb'; }
    else if(dist > targetKm * 1.4) { badge = '遠め'; badgeType = 'bo'; }
    // ハイライト生成
    if(dist < 0.8) highlight = '気軽に歩ける距離';
    else if(dist < 1.5) highlight = 'ちょうどよい散歩コース';
    else if(dist < 2.5) highlight = 'しっかり歩けるルート';
    else highlight = 'がっつり歩きたい方向け';
    if(S.mode === 'relax' && diff < 0.3) highlight += '・のんびり最適';
    if(S.mode === 'active' && dist > targetKm) highlight += '・アクティブ向き';
    return { ...st, badge, badgeType, highlight, emoji: '🚉' };
  });
}

  document.getElementById('stinfo').textContent='散歩距離'+S.dist+'km・'+S.mode==='relax'?'のんびりコース':'アクティブコース'+'として適した駅を提案しています';

}

// 複数カテゴリーを並行検索
async function fetchNearbySpots(){
  const center={lat:S.station.lat, lng:S.station.lng};
  const radius=800; // 駅から800m圏内

  // カテゴリー別に並行検索
  const searches=[
    {types:['cafe'],        label:'カフェ',   tagClass:'cafe',  emoji:'☕', max:4},
    {types:['bakery'],      label:'ベーカリー',tagClass:'cafe',  emoji:'🍞', max:3},
    {types:['restaurant'],  label:'飲食',     tagClass:'food',  emoji:'🍜', max:4},
    {types:['store','clothing_store','home_goods_store'], label:'雑貨・ショップ', tagClass:'shop', emoji:'🛍️', max:3},
    {types:['park'],        label:'公園',     tagClass:'park',  emoji:'🌿', max:3},
  ];

  const svc=new google.maps.places.PlacesService(document.createElement('div'));
  const allSpots=[];

  await Promise.all(searches.map(cat=>new Promise(res=>{
    svc.nearbySearch({
      location:center, radius,
      type:cat.types[0],
      rankBy:google.maps.places.RankBy.PROMINENCE,
      language:'ja'
    },(results,status)=>{
      if(status===google.maps.places.PlacesServiceStatus.OK){
        (results||[]).slice(0,cat.max).forEach((p,i)=>{
          allSpots.push({
            id: p.place_id,
            name: p.name,
            lat: p.geometry.location.lat(),
            lng: p.geometry.location.lng(),
            rating: p.rating||null,
            vicinity: p.vicinity||'',
            category: cat.label,
            tagClass: cat.tagClass,
            emoji: cat.emoji,
            tag: cat.label,
            openNow: p.opening_hours?.open_now
          });
        });
      }
      res();
    });
  })));

  // 距離を付与
  const withDist=allSpots.map(sp=>{
    const d=Math.sqrt(Math.pow((sp.lat-S.station.lat)*111,2)+Math.pow((sp.lng-S.station.lng)*91,2));
    return {...sp, distFromStation:Math.round(d*1000), walkMinFromStation:Math.round(d/4.5*60*10)};
  });
  return withDist.sort((a,b)=>a.distFromStation-b.distFromStation);
}

// Claude AIでスポットの説明・特徴を付与
function aiEnrichSpots(spots){
  // Claude APIなし — 距離・評価から説明文をローカル生成
  const suffixes = {
    'カフェ': ['こだわりコーヒー','ゆったり休憩に','雰囲気のいいカフェ','テラス席あり'],
    'ベーカリー': ['焼きたてパン','地元人気店','モーニングにも'],
    '飲食': ['地元グルメ','散歩の休憩に','ランチ利用可'],
    '雑貨・ショップ': ['散歩のついでに','お土産探しに','センスのいい雑貨'],
    '公園': ['緑が豊か','ベンチあり休憩に','のんびり散策に'],
  };
  return spots.map(sp => {
    const min = sp.walkMinFromStation || Math.round(sp.distFromStation/80);
    const suf = suffixes[sp.category] || ['立ち寄りスポット'];
    const pick = suf[Math.floor(Math.random()*suf.length)];
    const ratingStr = sp.rating ? ` · ★${sp.rating}` : '';
    return { ...sp, detail: `駅から徒歩${min}分 · ${pick}${ratingStr}` };
  });
}

function renderSp(spots){
  const c=document.getElementById('spcards'); c.innerHTML='';
  updSCnt();
  const groups={};
  spots.forEach(sp=>{if(!groups[sp.category])groups[sp.category]=[];groups[sp.category].push(sp);});
  const catEM={'カフェ':'☕','ベーカリー':'🍞','飲食':'🍜','雑貨・ショップ':'🛍️','公園':'🌿'};
  Object.entries(groups).forEach(([cat,items])=>{
    const sec=document.createElement('div');
    sec.innerHTML=`<div class="lbl">${catEM[cat]||'📍'} ${cat}</div>`;
    const g=document.createElement('div'); g.className='sgrid';
    items.forEach(sp=>{
      const d=document.createElement('div'); d.className='spcard'; d.dataset.id=sp.id;
      const openTag=sp.openNow===false?'<span style="font-size:9px;color:#c62828;margin-left:3px">現在閉店</span>':'';
      d.innerHTML=`<div class="spchk">✓</div>
        <div class="spem">${sp.emoji}</div>
        <div class="spname">${sp.name}${openTag}</div>
        <div class="spdet">${sp.detail||''}</div>
        ${sp.rating?`<div style="font-size:10px;color:#b85c00;margin-top:2px">★${sp.rating}</div>`:''}
        <span class="sptag t${sp.tagClass||'other'}">${sp.tag}</span>`;
      d.onclick=()=>togSp(sp,d);
      g.appendChild(d);
    });
    sec.appendChild(g); c.appendChild(sec);
  });
}

function togSp(sp,card){
  card.classList.toggle('selected');
  const i=S.selSpots.findIndex(s=>s.id===sp.id);
  if(i>=0)S.selSpots.splice(i,1); else S.selSpots.push(sp);
  updSCnt();
  document.getElementById('btnrt').disabled=S.selSpots.length===0;
}
function updSCnt(){
  const n=S.selSpots.length;
  document.getElementById('scnt').textContent=n>0?n+'か所選択中':'スポットを選んでください（複数選択可）';

// S4: ルート生成 — Directions API + Elevation API + Claude AI

async function goRt(){
  goTo(4);
  show('rtload'); hide('rtbody'); hide('rterr');
  document.getElementById('rtbot').style.display='none';
  document.getElementById('rttl').textContent='';
  setMsg('rtlmsg','ルートを計算中…');
  try{
    await whenMapsReadyAsync();

    // Directions API: 失敗してもフォールバックで続行
    setMsg('rtlmsg','徒歩ルートを検索中…');
    let dirResult=null, usedFallback=false;
    try{
      dirResult=await calcDirections();
    }catch(e){
      console.warn('Directions API失敗、概算モードで続行:', e.message);
      usedFallback=true;
    }

    // Elevation API: Directions成功時のみ
    setMsg('rtlmsg','高低差・坂情報を取得中…');
    const elevData = dirResult ? await fetchElevation(dirResult) : {up:null,down:null,maxSlope:null,points:[]};

    setMsg('rtlmsg','ルート情報を整理中…');
    const aiData=aiAnalyzeRoute(dirResult, elevData);

    S.route={dirResult, elevData, aiData, usedFallback};
    renderRt(dirResult, elevData, aiData);
    hide('rtload'); show('rtbody');
    document.getElementById('rtbot').style.display='block';
    initGMap(dirResult);
  }catch(e){
    hide('rtload'); show('rterr');
    document.getElementById('rterr').textContent='エラー: '+e.message;
  }
}

function calcDirections(){
  return new Promise((res,rej)=>{
    const svc=new google.maps.DirectionsService();
    const origin={lat:S.lat,lng:S.lng};
    const destination={lat:S.station.lat,lng:S.station.lng};
    const waypoints=S.selSpots.map(sp=>({
      location:{lat:sp.lat,lng:sp.lng},
      stopover:true
    }));
    svc.route({
      origin, destination, waypoints,
      travelMode:google.maps.TravelMode.WALKING,
      optimizeWaypoints:true,
      language:'ja'
    },(result,status)=>{
      if(status==='OK') res(result);
      else rej(new Error('Directions API: '+status));
    });
  });
}

function fetchElevation(dirResult){
  return new Promise((res)=>{
    const elev=new google.maps.ElevationService();
    // ルートのサンプルポイントを抽出
    const path=dirResult.routes[0].overview_path;
    const samples=Math.min(path.length, 30);
    const points=[];
    for(let i=0;i<samples;i++){
      points.push(path[Math.floor(i*path.length/samples)]);
    }
    elev.getElevationAlongPath({path:points,samples},
      (results,status)=>{
        if(status==='OK'){
          let up=0,down=0,prev=null;
          results.forEach(r=>{
            if(prev!==null){
              const diff=r.elevation-prev;
              if(diff>0)up+=diff; else down+=Math.abs(diff);
            }
            prev=r.elevation;
          });
          const maxSlope=Math.max(...results.map((r,i)=>{
            if(i===0)return 0;
            const dist=50; // 概算50m間隔
            return Math.abs(r.elevation-results[i-1].elevation)/dist*100;
          }));
          res({up:Math.round(up),down:Math.round(down),maxSlope:maxSlope.toFixed(1),points:results});
        } else {
          res({up:null,down:null,maxSlope:null,points:[]});
        }
    });
  });
}

function aiAnalyzeRoute(dirResult, elevData){
  // Claude APIなし — Directions/Elevation結果とユーザー設定からローカル生成
  let totalDist, totalTime;
  if(dirResult){
    const route=dirResult.routes[0];
    totalDist=(route.legs.reduce((s,l)=>s+l.distance.value,0)/1000).toFixed(1);
    totalTime=Math.round(route.legs.reduce((s,l)=>s+l.duration.value,0)/60);
  } else {
    const pts=[{lat:S.lat,lng:S.lng},...S.selSpots.map(sp=>({lat:sp.lat,lng:sp.lng})),{lat:S.station.lat,lng:S.station.lng}];
    let km=0;
    for(let i=0;i<pts.length-1;i++){
      const d=Math.sqrt(Math.pow((pts[i+1].lat-pts[i].lat)*111,2)+Math.pow((pts[i+1].lng-pts[i].lng)*91,2));
      km+=d*1.3;
    }
    totalDist=km.toFixed(1);
    totalTime=Math.round(km/4.5*60);
  }

  const km=parseFloat(totalDist);
  const calories=Math.round(km*60);

  // チップス生成
  const chips=[];
  if(S.mode==='relax') chips.push({text:'のんびりコース',type:'good'});
  else chips.push({text:'アクティブコース',type:'good'});

  if(elevData.maxSlope!==null){
    const slope=parseFloat(elevData.maxSlope);
    if(slope<3) chips.push({text:'ほぼ平坦',type:'good'});
    else if(slope<6) chips.push({text:'緩やかな坂あり',type:'warn'});
    else chips.push({text:'急坂あり（'+slope+'%）',type:'bad'});
    if(elevData.up>20) chips.push({text:'登り'+elevData.up+'m',type:'warn'});
  } else {
    if(S.avoids.includes('slope')) chips.push({text:'坂回避ルート',type:'good'});
    else chips.push({text:'高低差は現地確認を',type:'warn'});
  }

  if(S.avoids.includes('sun')) chips.push({text:'日差し回避優先',type:'good'});
  if(S.selSpots.length>=3) chips.push({text:'スポット'+S.selSpots.length+'か所経由',type:'good'});

  // ルート名
  const stationShort=S.station.name.replace(/駅$/,'');
  const modeWord=S.mode==='relax'?'のんびり':'アクティブ';
  const title=stationShort+'・'+modeWord+'散歩';

  // tips生成
  const tips=[];
  if(S.mode==='relax') tips.push({type:'good',text:'カフェやスポットでゆっくり休憩しながら楽しみましょう'});
  else tips.push({type:'good',text:'しっかりペースで歩いてカロリー消費を意識してみましょう'});
  if(elevData.maxSlope && parseFloat(elevData.maxSlope)>=5) tips.push({type:'warn',text:'坂が含まれます。帰り道の体力を残しておきましょう'});
  if(S.avoids.includes('sun')) tips.push({type:'warn',text:'日差しが強い時間帯は日陰のルートを優先してください'});
  tips.push({type:'good',text:'水分補給を忘れずに。途中のカフェで休憩もおすすめです'});

  return {title, _totalDist:totalDist, _totalMin:totalTime, calories, chips, tips};
}

  const totalDist=aiData._totalDist||'?';
  const totalMin=aiData._totalMin||'?';
  const elev=elevData.up!==null?`+${elevData.up}m/-${elevData.down}m`:'-';

  document.getElementById('rttl').textContent=aiData.title||'さんぽルート';
  document.getElementById('rchips').innerHTML=(aiData.chips||[]).map(c=>`<div class="rchip c${c.type==='good'?'g':c.type==='warn'?'w':'b'}">${c.type==='good'?'✓':c.type==='warn'?'⚠️':'⛔'} ${c.text}</div>`).join('');
  document.getElementById('sgrid4').innerHTML=`
    <div class="rt-stat"><div class="rt-stat-icon">🗺️</div><div><div class="rt-stat-val">${totalDist}</div><div class="rt-stat-lbl">km</div></div></div>
    <div class="rt-stat"><div class="rt-stat-icon">⏱️</div><div><div class="rt-stat-val">${totalMin}</div><div class="rt-stat-lbl">分</div></div></div>
    <div class="rt-stat"><div class="rt-stat-icon">🔥</div><div><div class="rt-stat-val">${aiData.calories||Math.round(parseFloat(totalDist)*60)}</div><div class="rt-stat-lbl">kcal</div></div></div>
    <div class="rt-stat"><div class="rt-stat-icon">⛰️</div><div><div class="rt-stat-val" style="font-size:16px">${elev}</div><div class="rt-stat-lbl">高低差</div></div></div>`;

  // 経由地ウェイポイント（Directions結果があれば各区間の正確な時間を表示）
  const legs=dirResult?dirResult.routes[0].legs:null;
  const wpts=[
    {name:'現在地（出発）', meta:'スタート', color:'#1a7a4a'},
    ...S.selSpots.map((sp,i)=>({
      name:sp.emoji+' '+sp.name,
      meta:legs&&legs[i]?`徒歩${Math.round(legs[i].duration.value/60)}分`:`（経由地${i+1}）`,
      color:'#2563a8'
    })),
    {name:'🚉 '+S.station.name, meta:`到着 合計${totalMin}分`, color:'#d4620a'}
  ];
  document.getElementById('wps').innerHTML=wpts.map((wp,i,a)=>`
    <div class="wp">
      <div class="wpdw">
        <div class="wpd" style="background:${wp.color}"></div>
        ${i<a.length-1?'<div class="wpl"></div>':''}
      </div>
      <div><div class="wpn">${wp.name}</div><div class="wpm">${wp.meta}</div></div>
    </div>`).join('');

  document.getElementById('rtips').innerHTML=(aiData.tips||[]).map(t=>`
    <div class="abox a${t.type==='warn'?'o':'g'}">
      <span>${t.type==='warn'?'⚠️':'🌿'}</span><span>${t.text}</span>
    </div>`).join('');
}

function initGMap(dirResult){
  if(S.gmap){
    if(S.directionsRenderer){S.directionsRenderer.setMap(null);S.directionsRenderer=null;}
  }
  const centerLat=(S.lat+S.station.lat)/2;
  const centerLng=(S.lng+S.station.lng)/2;
  S.gmap=new google.maps.Map(document.getElementById('map'),{
    zoom:14,
    center:{lat:centerLat,lng:centerLng},
    mapTypeControl:false,
    streetViewControl:false,
    fullscreenControl:false,
    zoomControl:true,
    gestureHandling:'cooperative',
    styles:[
      {featureType:'poi.business',stylers:[{visibility:'simplified'}]},
      {featureType:'transit',elementType:'labels.icon',stylers:[{visibility:'on'}]}
    ]
  });

  if(dirResult){
    // Directions APIのルートをそのまま描画
    S.directionsRenderer=new google.maps.DirectionsRenderer({
      map:S.gmap,
      polylineOptions:{strokeColor:'#1a7a4a',strokeWeight:5,strokeOpacity:.85},
      suppressMarkers:false
    });
    S.directionsRenderer.setDirections(dirResult);
  } else {
    // フォールバック: 直線で経路を描画してマーカーを打つ
    const pts=[
      {lat:S.lat,lng:S.lng,label:'🏠',title:'出発地'},
      ...S.selSpots.map(sp=>({lat:sp.lat,lng:sp.lng,label:sp.emoji||'📍',title:sp.name})),
      {lat:S.station.lat,lng:S.station.lng,label:'🚉',title:S.station.name}
    ];
    const polyline=new google.maps.Polyline({
      path:pts.map(p=>({lat:p.lat,lng:p.lng})),
      geodesic:true,
      strokeColor:'#1a7a4a',
      strokeOpacity:.8,
      strokeWeight:4,
      map:S.gmap
    });
    const bounds=new google.maps.LatLngBounds();
    pts.forEach((p,i)=>{
      bounds.extend({lat:p.lat,lng:p.lng});
      const colors=['#1a7a4a',...Array(S.selSpots.length).fill('#2563a8'),'#d4620a'];
      new google.maps.Marker({
        position:{lat:p.lat,lng:p.lng},
        map:S.gmap,
        title:p.title,
        icon:{path:google.maps.SymbolPath.CIRCLE,scale:8,fillColor:colors[i],fillOpacity:1,strokeColor:'#fff',strokeWeight:2}
      });
    });
    S.gmap.fitBounds(bounds,{padding:30});
  }
}

function startNav(){
  if(!S.station||!S.lat) return;
  const wpStr=S.selSpots.map(sp=>`${sp.lat},${sp.lng}`).join('/');
  const url=`https://www.google.com/maps/dir/${S.lat},${S.lng}/${wpStr?wpStr+'/':''}${S.station.lat},${S.station.lng}`;
  window.open(url,'_blank');
}

function regenRt(){
  document.getElementById('rttl').textContent='';
  goRt();
}

// Claude APIは使用しません（CORSのためブラウザから直接呼び出し不可）

// ============================================================
// UTILS

function show(id){
  const el=document.getElementById(id);
  // rtbodyはblockで展開（loading-boxなどはflex）
  el.style.display=(id==='rtbody'||id==='stlist'||id==='splist')?'block':'flex';
}
function hide(id){document.getElementById(id).style.display='none';}
function setMsg(id,t){const el=document.getElementById(id);if(el)el.textContent=t;}
function whenMapsReadyAsync(){return new Promise(res=>whenMapsReady(res));}
</script>
